# Publishes china-maps/public as a static site. With no keys the app shows
# OpenStreetMap places. Repository secrets switch it to a better source:
# AMAP_JS_KEY + AMAP_JS_SECURITY_CODE for AMap, or TENCENT_MAP_KEY for Tencent
# Maps (AMap wins if both are set).
name: Deploy China Maps to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['china-maps/public/**', '.github/workflows/china-maps-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
      AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
      TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write map keys config
        if: env.AMAP_JS_KEY != '' || env.TENCENT_MAP_KEY != ''
        run: >
          node -e "const e = process.env; require('fs').writeFileSync('china-maps/public/config.json',
          JSON.stringify({ amapKey: e.AMAP_JS_KEY, amapSecurityCode: e.AMAP_JS_SECURITY_CODE, tencentKey: e.TENCENT_MAP_KEY }))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: china-maps/public
      - id: deployment
        uses: actions/deploy-pages@v4

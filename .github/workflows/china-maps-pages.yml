# Publishes china-maps/public as a static site. With no keys the app shows
# OpenStreetMap places; add the repository secrets AMAP_JS_KEY and
# AMAP_JS_SECURITY_CODE to switch it to AMap search.
name: Deploy China Maps to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['china-maps/public/**', '.github/workflows/china-maps-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
      AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write AMap config
        if: env.AMAP_JS_KEY != ''
        run: >
          node -e "require('fs').writeFileSync('china-maps/public/config.json',
          JSON.stringify({ amapKey: process.env.AMAP_JS_KEY, amapSecurityCode: process.env.AMAP_JS_SECURITY_CODE }))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: china-maps/public
      - id: deployment
        uses: actions/deploy-pages@v4

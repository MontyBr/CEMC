<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4382c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>China Maps in English</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="top">
    <form id="search" class="search" autocomplete="off">
      <input id="q" type="search" enterkeyhint="search" placeholder="Search hotpot, spa, temples…" aria-label="Search">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
    </form>
    <div class="chips" id="chips">
      <button data-q="restaurant">🍜 Food</button>
      <button data-q="coffee">☕ Coffee</button>
      <button data-q="massage">💆 Spa &amp; massage</button>
      <button data-q="attractions">🏯 Sights</button>
      <button data-q="mall">🛍️ Shopping</button>
      <button data-q="bar">🍺 Bars</button>
      <button data-q="pharmacy">💊 Pharmacy</button>
      <button data-q="atm">🏧 ATM</button>
      <button data-q="metro station">🚇 Metro</button>
      <button data-q="toilet">🚻 Toilets</button>
    </div>
  </header>

  <div class="controls">
    <button id="locate" class="fab" aria-label="Show my location">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </button>
    <button id="lang" class="fab small" aria-label="Map label language">EN</button>
  </div>

  <section id="sheet" class="sheet" aria-live="polite">
    <div class="handle" id="handle"></div>
    <p id="status" class="status">Search for anything nearby — in English.</p>
    <ol id="results" class="results"></ol>
  </section>

  <section id="detail" class="detail" hidden>
    <button class="close" id="detail-close" aria-label="Close">×</button>
    <div id="detail-body"></div>
  </section>

  <section id="driver" class="driver" hidden>
    <p class="driver-hint">Show this to your driver or a local · 请带我去这里</p>
    <p id="driver-name" class="driver-name"></p>
    <p id="driver-address" class="driver-address"></p>
    <button id="driver-close" class="btn">Done</button>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
